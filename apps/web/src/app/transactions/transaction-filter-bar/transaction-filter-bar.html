<div class="filter-group">
  <span class="label" id="filter-type-label">Type</span>
  <ul
    ngListbox
    class="filter-listbox"
    orientation="horizontal"
    selectionMode="follow"
    aria-labelledby="filter-type-label"
    [value]="typeValue()"
    (valueChange)="selectType($event)"
  >
    <li ngOption value="all">All</li>
    <li ngOption value="expense">Expenses</li>
    <li ngOption value="income">Income</li>
  </ul>
</div>

<div class="filter-group">
  <span class="label" id="filter-group-label">Group</span>
  <ul
    ngListbox
    class="filter-listbox"
    orientation="horizontal"
    selectionMode="follow"
    aria-labelledby="filter-group-label"
    [value]="groupValue()"
    (valueChange)="selectGroup($event)"
  >
    <li ngOption [value]="0" label="All">All</li>
    @for (group of visibleGroups(); track group.id) {
      <li ngOption [value]="group.id" [label]="group.name">{{ group.name }}</li>
    }
  </ul>
</div>

@if (selectedGroup(); as group) {
  <div class="filter-group">
    <span class="label" id="filter-category-label">{{ group.name }}</span>
    <ul
      ngListbox
      class="filter-listbox"
      orientation="horizontal"
      selectionMode="follow"
      aria-labelledby="filter-category-label"
      [value]="categoryValue()"
      (valueChange)="selectCategory($event)"
    >
      <li ngOption [value]="0" label="All">All</li>
      @for (category of group.categories; track category.id) {
        <li ngOption [value]="category.id" [label]="category.name">{{ category.name }}</li>
      }
    </ul>
  </div>
}
